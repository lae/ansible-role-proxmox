
---
- name: Add PVE repository (deb822)
  ansible.builtin.deb822_repository:
    name: proxmox
    types: deb
    uris: "{{ pve_repository.uris }}"
    suites: "{{ pve_repository.suites }}"
    components: "{{ pve_repository.components }}"
    signed_by: "/etc/apt/trusted.gpg.d/proxmox-release-{{ ansible_distribution_release }}.gpg"
    state: present
    enabled: true
  register: _pve_repo
  when:
    - ansible_distribution_major_version | int >= 12

- name: Add PVE repository (legacy)
  ansible.builtin.apt_repository:
    repo: "deb {{ pve_repository.uris }} {{ pve_repository.suites }} {{ pve_repository.components }}"
    state: present
    filename: proxmox
  register: _pve_repo
  when: ansible_distribution_major_version | int < 12

- name: Ensure Ceph repository (PVE 8 and below) is compatible with new filename (PVE 9)
  block:
    - name: Check if old Ceph repository file exists
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/ceph.list
      register: _pve_ceph_repo_old_file
    - name: Rename old Ceph repository file to new filename
      ansible.builtin.command:
        mv /etc/apt/sources.list.d/ceph.list /etc/apt/sources.list.d/ceph.sources
      when: _pve_ceph_repo_old_file.stat.exists
  when:
    - pve_ceph_enabled | bool

- name: Add Ceph repository (deb822)
  ansible.builtin.deb822_repository:
    name: ceph
    types: deb
    uris: "{{ pve_ceph_repository.uris }}"
    suites: "{{ pve_ceph_repository.suites }}"
    components: "{{ pve_ceph_repository.components }}"
    signed_by: "/etc/apt/trusted.gpg.d/proxmox-release-{{ ansible_distribution_release }}.gpg"
    state: present
    enabled: true
  register: _pve_ceph_repo
  when:
    - ansible_distribution_major_version | int >= 12
    - pve_ceph_enabled | bool

- name: Add Ceph repository (legacy)
  ansible.builtin.apt_repository:
    repo: "deb {{ pve_ceph_repository.uris }} {{ pve_ceph_repository.suites }} {{ pve_ceph_repository.components }}"
    state: present
    filename: ceph
  register: _pve_ceph_repo
  when:
    - ansible_distribution_major_version | int < 12
    - pve_ceph_enabled | bool

- name: Update repositories
  ansible.builtin.apt:
    update_cache: yes
  when: _pve_repo is changed or _pve_ceph_repo is changed

- name: Ensure PVE enterprise repository is absent (deb822)
  ansible.builtin.deb822_repository:
    name: pve-enterprise
    enabled: false
    state: absent
  when:
    - ansible_distribution_major_version | int >= 12
    - pve_repository.components != "pve-enterprise"

- name: Ensure PVE enterprise repository is absent (legacy)
  ansible.builtin.apt_repository:
    repo: "deb {{ pve_repository.uris }} {{ pve_repository.suites }} pve-enterprise"
    state: absent
    filename: pve-enterprise
  when:
    - ansible_distribution_major_version | int < 12
    - pve_repository.components != "pve-enterprise"


