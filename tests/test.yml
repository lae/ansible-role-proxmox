---
- hosts: all
  become: true
  ignore_unreachable: true
  tasks:
    - name: Ensure Proxmox Web UI returns a successful HTTP response
      block:
        - uri:
            url: "https://{{ inventory_hostname }}:8006"
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check that this node is within the cluster and it is in quorum
      block:
        - ansible.builtin.shell: "pvesh get /cluster/status --output=json"
          register: _pve_cluster
          changed_when: false

        - ansible.builtin.assert:
            that: "(_pve_cluster.stdout | from_json | json_query(query)) == 1"
          vars:
            query: "([?type=='cluster'].quorate)[0]"
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check PVE realms configuration
      block:
        - ansible.builtin.shell: "pvesh get /access/domains --output=json"
          register: _pve_realms
          changed_when: false

        - ansible.builtin.assert:
            that: "(pve_domains_cfg | map(attribute='name') | list) is subset(_pve_realms.stdout | from_json | json_query(query))"
          vars:
            query: "[*].realm"
          run_once: true

        - ansible.builtin.assert:
            that:
              - item.type == realm.type
              - item.name == realm.realm
              - item.attributes.comment == realm.comment
          vars:
            realm: '{{ _pve_realms.stdout | from_json
                       | json_query("[?realm==''" + item.name + "'']") | first }}'
          with_items: "{{ pve_domains_cfg }}"
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check that PVE groups exist
      block:
        - ansible.builtin.shell: "pvesh get /access/groups --output=json"
          register: _pve_groups
          changed_when: false

        - ansible.builtin.assert:
            that: "(_pve_groups.stdout | from_json | json_query(query)) == 1"
          vars:
            query: "length([?groupid=='{{ item.name }}'])"
          run_once: true
          with_items: "{{ pve_groups }}"
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check that PVE users exist
      block:
        - ansible.builtin.shell: "pvesh get /access/users --output=json"
          register: _pve_users
          changed_when: false

        - ansible.builtin.assert:
            that: "(_pve_users.stdout | from_json | json_query(query)) == 1"
          vars:
            query: "length([?userid=='{{ item.name }}'])"
          run_once: true
          with_items: "{{ pve_users }}"
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check that PVE ACLs exist
      block:
        - ansible.builtin.shell: "pvesh get /access/acl --output=json"
          register: _pve_acl
          changed_when: false

        - ansible.builtin.assert:
            that: "(_pve_acl.stdout | from_json | json_query(query)) == expected_acl_count"
          vars:
            query: "length([])"
            expected_acl_count: >-
              {{
                (pve_acls | map(attribute='groups') | map('default', []) | map('length') | sum)
                +
                (pve_acls | map(attribute='users') | map('default', []) | map('length') | sum)
              }}
          run_once: true
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check that PVE storages exist
      block:
        - ansible.builtin.shell: "pvesh get /storage --output=json"
          register: _pve_storage
          changed_when: false

        - ansible.builtin.set_fact:
            sto_list: "{{ sto_list | default([]) }} + [ '{{ item.name }}' ]"
          with_items: "{{ pve_storages }}"

        - ansible.builtin.assert:
            that: "sto_list is subset(_pve_storage.stdout | from_json | json_query(query))"
          vars:
            query: "[*].storage"
          run_once: true
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check that user specified ZFS volumes exist
      block:
        - zfs_facts:
            dataset: "{{ item }}"
          with_items: "{{ pve_zfs_create_volumes }}"
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check datacenter.cfg content
      block:
        - ansible.builtin.slurp:
            src: "/etc/pve/datacenter.cfg"
          register: datacenter_cfg

        - ansible.builtin.assert:
            that: "'{{ item.key }}: {{ item.value }}' in datacenter_cfg.content | b64decode"
          loop: "{{ pve_datacenter_cfg | dict2items }}"
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Check PVE HA group configuration
      block:
        - ansible.builtin.command: "pvesh get /cluster/ha/groups --output=json"
          register: _ha_group_list
          run_once: true

        - ansible.builtin.assert:
            that:
              - item.name == ha_group.group
              - item.comment == ha_group.comment
              - item.nodes == ha_group.nodes
              - item.restricted == ha_group.restricted
              - "'nofailback' not in ha_group"
          vars:
            ha_group: '{{ _ha_group_list.stdout | from_json
                          | json_query("[?group==''" + item.name + "'']") | first }}'
          with_items: "{{ pve_cluster_ha_groups }}"
      rescue:
        - ansible.builtin.set_fact:
            test_suite_failed: true

    - name: Collect service diagnostics
      block:
        - ansible.builtin.shell: "journalctl --no-pager -xu pvedaemon.service"
          changed_when: false
        - ansible.builtin.shell: "journalctl --no-pager -xu pve-cluster.service"
          changed_when: false
        - ansible.builtin.shell: "journalctl --no-pager -xu pveproxy.service"
          changed_when: false
        - ansible.builtin.shell: "cat /etc/hosts"
          changed_when: false
      ignore_errors: true

    - name: Fail if any test checks failed
      ansible.builtin.fail:
        msg: "One or more test checks failed. Review the task results above."
      when: test_suite_failed | default(false)
